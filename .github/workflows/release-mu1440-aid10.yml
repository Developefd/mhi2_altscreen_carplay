name: Release MU1440 AID10 developer ZIP

on:
  push:
    branches: [ main ]
    paths:
      - 'release/MU1440_AID10_DEV_2026-09-28.md'

permissions:
  contents: write

concurrency:
  group: mu1440-aid10-dev-release
  cancel-in-progress: false

env:
  TAG: mu1440-aid10-dev-2026-09-28
  ZIP_NAME: MHI2_AltScreen_MU1440_AID10_DEV_2026-09-28.zip

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4

      - name: Final release audit
        shell: bash
        run: |
          set -euxo pipefail

          test "$(sha256sum artifacts/mu1440/altscreen111/vehicle-tested-2026-09-27/libaltscreen111.so | awk '{print $1}')" = \
            "094e3f1abfbf949f8c11b27e048e8213e5fc71178e62efd3c56deed8ee3bf8d8"
          test "$(sha256sum artifacts/mu1440/direct-ts-remux/vehicle-tested-2026-09-27/direct-ts-remux | awk '{print $1}')" = \
            "b761a8741682e3cbc6e05f5fe1705475c34c4805d1cd1ce09333274a301e735e"
          test "$(sha256sum artifacts/mu1440/isotx2-gate/vehicle-tested-run51/libmibr_isotx2_gate.so | awk '{print $1}')" = \
            "05673010a88c25022145ffb4e75d3715eaf686f4127ac188e91a52f512b9d957"
          test "$(sha256sum artifacts/mu1440/sha256sum-compat/build-confirmed-current/sha256sum | awk '{print $1}')" = \
            "5e8836b845005d942f155913e2398c7b1ed72582ade9ee4f56e56ce58f77d32f"
          test "$(sha256sum artifacts/mu1440/tee-compat/build-confirmed-current/tee | awk '{print $1}')" = \
            "522d7a7cb15e585d7978dbb885de57fec123e8fb3ce06979feb3986609ad54d4"

          grep -Fq 'EXPECTED_GEN2=094e3f1abfbf949f8c11b27e048e8213e5fc71178e62efd3c56deed8ee3bf8d8' deployment/mu1440/install.sh
          grep -Fq 'EXPECTED_REMUX=b761a8741682e3cbc6e05f5fe1705475c34c4805d1cd1ce09333274a301e735e' deployment/mu1440/install.sh
          grep -Fq 'EXPECTED_GATE=05673010a88c25022145ffb4e75d3715eaf686f4127ac188e91a52f512b9d957' deployment/mu1440/install.sh
          grep -Fq 'EXPECTED_NAVIGNORE=b065bab0e1c58f8439a3bdd73d2d4cb6060cbac1c943e5b425425eb453c94b34' deployment/mu1440/install.sh
          grep -Fq 'fail "navignore_required expected=$EXPECTED_NAVIGNORE"' deployment/mu1440/install.sh

          grep -Fq 'TEST="$MEDIA_ROOT/.mibr-altscreen-write-test.$$"' deployment/mu1440/install.sh
          grep -Fq 'TEST="$BACKUPFOLDER/.write-test-$$"' runtime/auto-direct/common.sh
          grep -Fq 'mount -uw "$DEPLOY_MEDIA_ROOT"' runtime/auto-direct/common.sh
          grep -Fq 'payload/tee' tools/prepare_mu1440_sd.sh
          grep -Fq 'vehicle-tested-run51/libmibr_isotx2_gate.so' tools/prepare_mu1440_sd.sh

          ! grep -R -n -F '/apps/sbin' deployment/mu1440 runtime/auto-direct runtime/isotx2-gate
          ! grep -R -n -F 'config/BASICS' deployment/mu1440 runtime/auto-direct runtime/isotx2-gate
          ! grep -R -n -F 'apps/mounts' deployment/mu1440 runtime/auto-direct runtime/isotx2-gate
          ! grep -R -n -E '(^|[^A-Za-z0-9_])sed([[:space:]]|$)' deployment/mu1440 runtime/auto-direct runtime/isotx2-gate runtime/navigation
          ! grep -R -n -E '(^|[;&|[:space:]])printf[[:space:]]' deployment/mu1440 runtime

      - name: Assemble SD-root package
        shell: bash
        run: |
          set -euxo pipefail
          PKG="$RUNNER_TEMP/pkg"
          mkdir -p "$PKG"
          tools/prepare_mu1440_sd.sh "$PKG"

          test -x "$PKG/install.sh"
          test -x "$PKG/status.sh"
          test -x "$PKG/uninstall.sh"
          test -f "$PKG/PAYLOAD.sha256"
          test ! -e "$PKG/MHI2AltScreen"
          test ! -e "$PKG/esd"
          test ! -e "$PKG/runtime/navigation/gen2_safearea.sh"
          test ! -e "$PKG/runtime/experimental"
          test -z "$(find "$PKG" -type f -name '*.jar' -print -quit)"

          (
            cd "$PKG"
            sha256sum -c PAYLOAD.sha256
            while IFS= read -r script; do
              bash -n "$script"
            done < <(find . -type f -name '*.sh' -print | sort)
          )

          cat > "$PKG/README-FIRST.txt" <<'EOF'
          MHI2 AltScreen CarPlay — MU1440 / AID10-class developer test release
          ====================================================================

          VEHICLE-TESTED TARGET ONLY:
            MHI2_ER_SKG13_P4526_MU1440
            10.x-inch MQB Virtual Cockpit / project shorthand: AID10-class

          NOT validated for 12.3-inch AID or other cluster generations.

          REQUIRED JAVA COMPONENT:
            MIBR-NavIgnore.jar
            SHA-256:
            b065bab0e1c58f8439a3bdd73d2d4cb6060cbac1c943e5b425425eb453c94b34

          The JAR is NOT included because it contains modified OEM-derived classes.
          Before running install.sh, either:
            - the exact JAR must already be installed on the target, or
            - place it at payload/MIBR-NavIgnore.jar

          DirectVCPolicy / Most20FPS / legacy combined Java overrides must NOT be active.
          The installer checks and refuses known conflicting bootclasspath overrides.

          SafeArea/ViewArea experimental helpers are intentionally NOT part of this ZIP.

          Copy/extract the ZIP contents directly to the SD-card root.

          On the unit:
            ./install.sh --check
            ./install.sh --apply
            reboot
            ./status.sh

          The DisplayManager gate defaults to STOCK.
          The current D2 keyframe policy remains an explicit developer switch.
          EOF

          {
            echo "release_tag=$TAG"
            echo "source_commit=$GITHUB_SHA"
            echo "target=MHI2_ER_SKG13_P4526_MU1440"
            echo "cluster=AID10-class"
            echo "gen2_sha256=094e3f1abfbf949f8c11b27e048e8213e5fc71178e62efd3c56deed8ee3bf8d8"
            echo "direct_ts_remux_sha256=b761a8741682e3cbc6e05f5fe1705475c34c4805d1cd1ce09333274a301e735e"
            echo "isotx2_gate_sha256=05673010a88c25022145ffb4e75d3715eaf686f4127ac188e91a52f512b9d957"
            echo "sha256sum_helper_sha256=5e8836b845005d942f155913e2398c7b1ed72582ade9ee4f56e56ce58f77d32f"
            echo "tee_helper_sha256=522d7a7cb15e585d7978dbb885de57fec123e8fb3ce06979feb3986609ad54d4"
            echo "required_navignore_sha256=b065bab0e1c58f8439a3bdd73d2d4cb6060cbac1c943e5b425425eb453c94b34"
          } > "$PKG/RELEASE-MANIFEST.txt"

          (
            cd "$PKG"
            sha256sum $(find . -type f ! -name RELEASE-SHA256SUMS.txt -print | sort) > RELEASE-SHA256SUMS.txt
            zip -9 -r "$GITHUB_WORKSPACE/$ZIP_NAME" .
          )
          unzip -t "$ZIP_NAME"
          sha256sum "$ZIP_NAME" > "$ZIP_NAME.sha256"

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          NOTES=release/MU1440_AID10_DEV_2026-09-28.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP_NAME" "$ZIP_NAME.sha256" --clobber
            gh release edit "$TAG" --title "MU1440 / AID10 developer test — 2026-09-28" --notes-file "$NOTES" --prerelease
          else
            gh release create "$TAG" "$ZIP_NAME" "$ZIP_NAME.sha256" \
              --target "$GITHUB_SHA" \
              --title "MU1440 / AID10 developer test — 2026-09-28" \
              --notes-file "$NOTES" \
              --prerelease
          fi
