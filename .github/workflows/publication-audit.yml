name: Publication integrity audit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  audit:
    name: Publication integrity audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit public tree
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/audit_public_repo.py


      - name: Deployment smoke audit
        shell: bash
        run: |
          set -euxo pipefail

          bash -n deployment/mu1440/install.sh
          bash -n deployment/mu1440/uninstall.sh
          bash -n deployment/mu1440/status.sh
          bash -n tools/prepare_mu1440_sd.sh

          for f in \
            artifacts/mu1440/altscreen111/vehicle-tested-2026-09-27/libaltscreen111.so \
            artifacts/mu1440/direct-ts-remux/vehicle-tested-2026-09-27/direct-ts-remux \
            artifacts/mu1440/isotx2-gate/build-confirmed-current/libmibr_isotx2_gate.so \
            runtime/auto-direct/common.sh \
            runtime/auto-direct/patch_carplay.sh \
            runtime/auto-direct/restore_stock.sh \
            runtime/auto-direct/verify_carplay111_boot.sh \
            runtime/auto-direct/direct_ts_auto_enable.sh \
            runtime/auto-direct/direct_ts_auto_disable.sh \
            runtime/auto-direct/direct_ts_auto_start.sh \
            runtime/auto-direct/direct_ts_auto_stop.sh \
            runtime/auto-direct/direct_ts_auto_status.sh \
            runtime/auto-direct/direct_ts_auto_supervisor.sh \
            runtime/auto-direct/direct_ts_auto_watchdog.sh \
            runtime/auto-direct/writev_gate.sh \
            runtime/auto-direct/altscreen111.conf \
            runtime/isotx2-gate/install_preload.sh \
            runtime/isotx2-gate/restore_preload.sh \
            runtime/diagnostics/gen2_keyframes.sh \
            runtime/diagnostics/gen2_resync.sh \
            runtime/diagnostics/gen2_status.sh \
            runtime/navigation/gen2_nav_config.sh \
            runtime/navigation/gen2_safearea.sh
          do
            test -s "$f"
          done

          test "$(sha256sum artifacts/mu1440/altscreen111/vehicle-tested-2026-09-27/libaltscreen111.so | awk '{print $1}')" = \
            "094e3f1abfbf949f8c11b27e048e8213e5fc71178e62efd3c56deed8ee3bf8d8"
          test "$(sha256sum artifacts/mu1440/direct-ts-remux/vehicle-tested-2026-09-27/direct-ts-remux | awk '{print $1}')" = \
            "b761a8741682e3cbc6e05f5fe1705475c34c4805d1cd1ce09333274a301e735e"
          test "$(sha256sum artifacts/mu1440/isotx2-gate/build-confirmed-current/libmibr_isotx2_gate.so | awk '{print $1}')" = \
            "0b3cf76ab6bbcc12223ca00fa01229a7fe3943ad4d1566fb769181aadf6a57b1"

          grep -Fq 'EXPECTED_GEN2=094e3f1abfbf949f8c11b27e048e8213e5fc71178e62efd3c56deed8ee3bf8d8' deployment/mu1440/install.sh
          grep -Fq 'EXPECTED_REMUX=b761a8741682e3cbc6e05f5fe1705475c34c4805d1cd1ce09333274a301e735e' deployment/mu1440/install.sh
          grep -Fq 'EXPECTED_GATE=0b3cf76ab6bbcc12223ca00fa01229a7fe3943ad4d1566fb769181aadf6a57b1' deployment/mu1440/install.sh
          grep -Fq 'profile map-rich' deployment/mu1440/install.sh

          ! grep -Fq 'printf ' deployment/mu1440/install.sh
          ! grep -Fq 'printf ' deployment/mu1440/uninstall.sh
