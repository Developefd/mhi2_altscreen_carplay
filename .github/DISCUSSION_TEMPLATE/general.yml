title: "[General] "
body:
  - type: markdown
    attributes:
      value: |
        Use General for architecture discussion, platform coordination and topics that are not yet actionable Issues.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CarPlay / iOS
        - MHI2
        - Virtual Cockpit / MOST
        - Java / DisplayManagement
        - ViewArea
        - RGI / navigation guidance
        - New platform / vehicle
        - Repository / documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: topic
    attributes:
      label: Topic
      description: What would you like to discuss?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context / evidence
      description: Add firmware/build identifiers, public links, logs or observations when relevant.

  - type: checkboxes
    id: privacy
    attributes:
      label: Before posting
      options:
        - label: I removed credentials, VINs, addresses and other private information.
          required: true
